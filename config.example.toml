# home-runner config for an Apple Silicon Mac (M1–M4).
# `home-runner init` writes a version of this tailored to the machine it runs on.

[github]
# Org-level runners (recommended): any repo in the org can use them.
org = "your-org"
# Personal accounts can't have org runners; register per repo instead:
# repo = "owner/name"
# runner_group_id = 1          # org runner group; 1 = "Default"

[github.auth]
# A GitHub App is the durable choice: tokens are minted on demand and never expire on you.
# Org permission needed: "Self-hosted runners: Read and write" (repo scope: "Administration: Read and write").
type = "app"
app_id = 123456
private_key_path = "~/.home-runner/github-app.pem"
# Or a personal access token stored in a file:
# type = "token"
# file = "~/.home-runner/token"

[host]
# Must be unique per machine. Prefixes every runner, VM and container this machine creates.
name = "studio-m2"
# Keeps the Mac awake while home-runner runs.
prevent_sleep = true

# Savings estimates in the job ledger (`home-runner jobs`, `home-runner savings`).
[pricing]
electricity_usd_per_kwh = 0.17      # your power price
job_watts = 30                      # extra draw while a job runs
annotate_jobs = true                # post "saved ~$X" on each workflow run
# github_self_hosted_usd_per_minute = 0.002   # if GitHub's postponed self-hosted fee ever applies
# [pricing.rates]                   # override list prices; ids from `home-runner prices`
# github-linux-arm64-4 = 0.008

# Report savings and status to a shared fleet. `home-runner fleet join` writes this for you.
# [fleet]
# url = "https://home-runner-fleet.example.workers.dev"
# house = "Zack's house"
# share = "repos"                   # totals | repos | full (see README, "Fleet")
# hash_private_repos = true

# Get a message when a pool can't keep a runner online (and when it recovers).
# [alerts]
# webhook_url = "https://hooks.slack.com/services/..."   # or a Discord webhook, ntfy.sh/<topic>, or your own URL
# format = "slack"                # json (default), slack, discord, ntfy
# stalled_minutes = 10

# Job prerequisites: what a worker must have before a pool takes jobs, checked inside a real worker
# as the runner user. Attach one to a pool with `profile = "web"`; check it with
# `home-runner prereq inspect`, build what's missing with `home-runner prereq install`.
# [[profile]]
# name = "web"
# version = 1                          # bump to invalidate readiness
# [[profile.require]]
# kind = "command"
# name = "node"
# version = "26"
# [[profile.require]]
# kind = "apt"
# packages = ["libasound2-dev", "pkg-config"]
# [[profile.require]]
# kind = "docker"                      # needs docker_in_job = true on the pool
# [[profile.require]]
# kind = "playwright"
# versions = ["1.56.1"]

# Linux arm64 jobs, one lightweight VM per job via Apple's `container`.
#   runs-on: [self-hosted, Linux, ARM64]
[[pool]]
name = "linux-arm64"
backend = "apple-container"
count = 2
labels = ["home"]
image = "ghcr.io/actions/actions-runner:latest"
cpus = 4
memory = "8G"

# Linux x64 jobs through Rosetta. Slower than native, fine for most builds.
#   runs-on: [self-hosted, Linux, X64]
[[pool]]
name = "linux-x64"
backend = "apple-container"
count = 1
labels = ["home"]
arch = "amd64"
cpus = 4
memory = "8G"

# An ubuntu-latest-like image with Node, pnpm and Rust preinstalled and a persistent cache per slot.
# Build the image first: ./images/ubuntu-latest/build.sh arm64
#   runs-on: [self-hosted, home, ubuntu-latest]
# Use a runner group limited to the repos that should land here, since the cache carries over
# between their jobs.
# [[pool]]
# name = "ubuntu-latest"
# backend = "apple-container"
# runner_group_id = 2
# count = 2
# labels = ["home", "ubuntu-latest"]
# image = "home-runner/ubuntu-latest:arm64"
# pull = false
# cache_size = "40G"
# docker_in_job = true            # run dockerd in each job: docker build/run, container:, services:
# profile = "web"                 # require a [[profile]] to pass before this pool takes jobs
# cpus = 8
# memory = "16G"

# macOS jobs in a throwaway Tart VM (at most 2 macOS VMs per Mac). For an image with Node, pnpm,
# Rust and sccache preinstalled and a persistent cache disk per slot, see images/macos-latest and
# set image = "home-runner-macos-latest", ssh_key and cache_size = "150G".
#   runs-on: [self-hosted, macOS, ARM64]
[[pool]]
name = "macos"
backend = "tart"
compare_github = "github-macos-arm64-3"   # price against the standard M1 runner, not the 5-core
count = 1
labels = ["home"]
image = "ghcr.io/cirruslabs/macos-sequoia-xcode:latest"
cpus = 4
memory_mb = 8192
ssh_user = "admin"
ssh_password = "admin"          # Cirrus Labs image default; or bake a key in and set ssh_key
job_timeout_minutes = 240

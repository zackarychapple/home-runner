name: deploy-fleet

# Ships the fleet Worker (Cloudflare) and the dashboard (Zephyr) when they change on main.
#
#   secrets:   CLOUDFLARE_API_TOKEN  (Workers Scripts: Edit, D1: Edit)
#              ZE_SECRET_TOKEN       (Zephyr API token)
#   variables: CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID, FLEET_URL (the Worker's address)

on:
  push:
    branches: [main]
    paths:
      - fleet-worker/**
      - dashboard/**
      - .github/workflows/deploy-fleet.yml
  workflow_dispatch:

concurrency:
  group: deploy-fleet
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fleet-worker/package-lock.json
      - run: npm ci
      - run: npm run check && npm test
      - name: Point wrangler.toml at the real database
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - run: npx wrangler d1 migrations apply home-runner-fleet --remote
      - run: npx wrangler deploy

  dashboard:
    needs: worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check && npm test
      - run: npm run deploy
        env:
          VITE_FLEET_URL: ${{ vars.FLEET_URL }}
          ZE_SECRET_TOKEN: ${{ secrets.ZE_SECRET_TOKEN }}
